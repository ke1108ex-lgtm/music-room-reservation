<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音楽室予約サイト</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Reservation System</p>
          <h1>音楽室予約サイト</h1>
        </div>
        <div class="badge">1バンドあたり2枠まで</div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>新規予約</h2>

          <form id="reservation-form">
            <div class="field">
              <label for="band-name">バンド名</label>
              <input id="band-name" name="band-name" type="text" placeholder="例: Sunset Echo" required />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="room">音楽室</label>
                <select id="room" name="room" required>
                  <option value="">選択してください</option>
                  <option value="Room A">Room A</option>
                  <option value="Room B">Room B</option>
                  <option value="Room C">Room C</option>
                </select>
              </div>

              <div class="field">
                <label for="day">日付</label>
                <input id="day" name="day" type="date" required />
              </div>
            </div>

            <div class="field">
              <label for="time">時間帯</label>
              <select id="time" name="time" required>
                <option value="">選択してください</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
                <option value="20:00">20:00</option>
              </select>
            </div>

            <button type="submit" class="primary-btn">予約する</button>
          </form>

          <p id="message" class="message" aria-live="polite"></p>
        </section>

        <section class="panel schedule-panel">
          <h2>予約状況</h2>
          <div id="schedule" class="schedule"></div>
        </section>
      </main>

      <section class="panel list-panel">
        <h2>予約一覧</h2>
        <ul id="booking-list" class="booking-list"></ul>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
